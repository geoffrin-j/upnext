<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6EE7B7"/>
      <stop offset="55%"  stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Chevrons — centred horizontally, upper half -->
  <!-- Top chevron -->
  <polyline
    points="196,210  256,152  316,210"
    stroke="rgba(255,255,255,0.45)"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"/>

  <!-- Middle chevron -->
  <polyline
    points="196,254  256,196  316,254"
    stroke="rgba(255,255,255,0.72)"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"/>

  <!-- Bottom chevron -->
  <polyline
    points="196,298  256,240  316,298"
    stroke="white"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"/>

  <!-- Wordmark — "up" light + "Next" bold, centred below chevrons -->
  <text
    x="148"
    y="390"
    font-family="'Plus Jakarta Sans', Arial, sans-serif"
    font-size="88"
    font-weight="300"
    fill="rgba(255,255,255,0.88)">up</text>
  <text
    x="228"
    y="390"
    font-family="'Plus Jakarta Sans', Arial, sans-serif"
    font-size="88"
    font-weight="800"
    fill="white">Next</text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details - Career Craft Academy</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- Course Hero -->
    <section class="course-detail-hero" id="courseHero">
        <!-- Will be populated by JavaScript -->
    </section>

    <!-- Course Content -->
    <section>
        <div class="container">
            <div class="course-detail-content">
                <div class="course-main" id="courseMain">
                    <!-- Will be populated by JavaScript -->
                </div>
                
                <div class="course-sidebar" id="courseSidebar">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </section>

    <!-- CTA Section -->
    <section style="background: var(--gradient); color: white; text-align: center;">
        <div class="container">
            <h2 style="color: white;">Ready to Get Started?</h2>
            <p style="font-size: 1.2rem; margin-bottom: 2rem;">Take the first step towards your AI & Data Science career</p>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="contact.html" class="cta-button">Apply Now</a>
                <a href="contact.html?type=counseling" class="cta-button">Book Counseling</a>
            </div>
        </div>
    </section>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/course-detail.js"></script>
</body>
</html>
